name: The Western Frontier
services:
  - type: web
    name: western-frontier
    env: python
    pythonVersion: 3.14.3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: SECRET_KEY
        value: change-me-to-a-secure-random-secret
      - key: FLASK_ENV
        value: production
